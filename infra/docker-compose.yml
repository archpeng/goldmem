services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: goldmem
      POSTGRES_PASSWORD: goldmem
      POSTGRES_DB: goldmem
    ports:
      - "5432:5432"

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  mem0-postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: mem0
      POSTGRES_PASSWORD: mem0
      POSTGRES_DB: mem0
    ports:
      - "5433:5432"
    volumes:
      - mem0-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mem0 -d mem0"]
      interval: 5s
      timeout: 5s
      retries: 20

  mem0:
    build:
      context: .
      dockerfile: mem0.Dockerfile
    image: goldmem-mem0-api:local
    depends_on:
      mem0-postgres:
        condition: service_healthy
      mem0-neo4j:
        condition: service_healthy
    environment:
      AUTH_DISABLED: "true"
      JWT_SECRET: "local-development-only-change-me"
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      HISTORY_DB_PATH: /app/history/history.db
      MEM0_DEFAULT_LLM_MODEL: ${MEM0_DEFAULT_LLM_MODEL:-${OPENAI_MODEL:-gpt-5.5}}
      MEM0_DEFAULT_EMBEDDER_MODEL: ${MEM0_DEFAULT_EMBEDDER_MODEL:-text-embedding-3-small}
      MEM0_USE_INPUT_LANGUAGE: ${MEM0_USE_INPUT_LANGUAGE:-true}
      MEM0_CHINESE_NLP: ${MEM0_CHINESE_NLP:-jieba}
      MEM0_CHINESE_DICT: ${MEM0_CHINESE_DICT:-/app/goldmem/chinese_dict.txt}
      POSTGRES_HOST: mem0-postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: mem0
      POSTGRES_USER: mem0
      POSTGRES_PASSWORD: mem0
      NEO4J_URI: bolt://mem0-neo4j:7687
      NEO4J_USERNAME: neo4j
      NEO4J_PASSWORD: mem0graph
    ports:
      - "8888:8000"
    volumes:
      - mem0-history-data:/app/history

  mem0-neo4j:
    image: neo4j:5.26.4
    environment:
      NEO4J_AUTH: neo4j/mem0graph
      NEO4J_server_memory_heap_initial__size: 512m
      NEO4J_server_memory_heap_max__size: 512m
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - mem0-neo4j-data:/data
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p mem0graph 'RETURN 1' >/dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 30

  graphiti-neo4j:
    image: neo4j:5.26.4
    profiles: ["graphiti"]
    environment:
      NEO4J_AUTH: neo4j/graphitimem
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_server_memory_heap_initial__size: 512m
      NEO4J_server_memory_heap_max__size: 512m
    ports:
      - "7475:7474"
      - "7688:7687"
    volumes:
      - graphiti-neo4j-data:/data
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p graphitimem 'RETURN 1' >/dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 30

  graphiti-sidecar:
    build:
      context: ..
      dockerfile: services/graphiti-sidecar/Dockerfile
    image: goldmem-graphiti-sidecar:local
    profiles: ["graphiti"]
    depends_on:
      postgres:
        condition: service_started
      graphiti-neo4j:
        condition: service_healthy
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      DATABASE_URL: postgres://goldmem:goldmem@postgres:5432/goldmem
      MODEL_NAME: ${GRAPHITI_MODEL:-${OPENAI_MODEL:-gpt-4.1-mini}}
      GRAPHITI_API_KEY: ${GRAPHITI_API_KEY:-}
      GRAPHITI_NEO4J_URI: ${GRAPHITI_SIDECAR_NEO4J_URI:-bolt://graphiti-neo4j:7687}
      GRAPHITI_NEO4J_USER: ${GRAPHITI_NEO4J_USER:-neo4j}
      GRAPHITI_NEO4J_PASSWORD: ${GRAPHITI_NEO4J_PASSWORD:-graphitimem}
      GRAPHITI_NEO4J_DATABASE: ${GRAPHITI_NEO4J_DATABASE:-neo4j}
      GRAPHITI_TELEMETRY_ENABLED: ${GRAPHITI_TELEMETRY_ENABLED:-false}
      SEMAPHORE_LIMIT: ${GRAPHITI_SEMAPHORE_LIMIT:-2}
    ports:
      - "8890:8000"

  graphiti-worker:
    image: node:25-alpine
    profiles: ["graphiti"]
    working_dir: /app
    depends_on:
      postgres:
        condition: service_started
      graphiti-sidecar:
        condition: service_started
    environment:
      DATABASE_URL: postgres://goldmem:goldmem@postgres:5432/goldmem
      GRAPHITI_BASE_URL: http://graphiti-sidecar:8000
      GRAPHITI_API_KEY: ${GRAPHITI_API_KEY:-}
      GRAPHITI_WORKER_BATCH_SIZE: ${GRAPHITI_WORKER_BATCH_SIZE:-10}
      GRAPHITI_WORKER_POLL_MS: ${GRAPHITI_WORKER_POLL_MS:-5000}
    volumes:
      - ..:/app
    command: ["sh", "-lc", "corepack enable && pnpm graphiti:worker"]

volumes:
  mem0-postgres-data:
  mem0-history-data:
  mem0-neo4j-data:
  graphiti-neo4j-data:
